server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    # API vhost: index.html/index.htm are deliberately absent so a stray
    # public/index.html can never shadow Laravel's front controller.
    index index.php;

    client_max_body_size 32m;          # must stay <= php post_max_size (php/uploads.ini)
    client_body_timeout  60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/xml;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Hidden files are denied before any other regex location can serve them.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Laravel health route; probed by the compose healthcheck, so keep it quiet.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $https if_not_empty;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }
}
