; Two processes, one container - the shape a single-container PaaS instance
; requires. Compose keeps nginx and php-fpm as separate services; this file is
; only used by the deployable `prod` image.
;
; Everything logs to stdout/stderr so `render logs` / `kubectl logs` / `docker
; logs` show both processes interleaved, and nothing needs a writable log
; directory.
;
; This is the WHOLE config, not a snippet dropped into conf.d: Debian's default
; supervisord.conf declares a [unix_http_server] socket under /var/run, which
; www-data cannot create - supervisord then dies with
; "Cannot open an HTTP server: socket.error reported errno.EACCES (13)".
; No control socket is declared here because nothing runs supervisorctl.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; php-fpm first. nginx will 502 for the moment before fpm is listening, which is
; why the platform health check must point at /up - it goes through fpm, so the
; container is only reported healthy once both halves are actually up.
[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; `pid` is rewritten to /tmp inside nginx.conf at build time - passing it via
; `-g` here instead collides with the file's own directive and nginx refuses to
; start with "pid directive is duplicate".
command=nginx -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
