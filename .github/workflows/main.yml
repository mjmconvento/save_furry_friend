name: CI (backend, frontend, compose)
on: [push, pull_request]

jobs:
    code-quality:
        runs-on: ubuntu-latest

        # The suite runs against real Postgres and MongoDB rather than sqlite:
        # uuid primary keys, the user_followers composite cascade and ILIKE are
        # all things sqlite gets wrong or silently permits.
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

            mongo:
                image: mongo:8.0
                env:
                    MONGO_INITDB_ROOT_USERNAME: admin
                    MONGO_INITDB_ROOT_PASSWORD: password
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        env:
            # PHPUnit does not overwrite variables that already exist in the
            # environment, so these override the Docker hostnames in phpunit.xml.
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            MONGODB_URI: mongodb://127.0.0.1:27017

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  # mongodb is required: the Post model and three migrations
                  # talk to MongoDB, so the suite cannot boot without it.
                  extensions: mbstring, pdo, pdo_pgsql, mongodb
                  coverage: none

            # Composer's cache dir is ~/.cache/composer on the runners; keyed on
            # the lockfile so a dependency bump misses and everything else hits.
            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ hashFiles('backend_full_laravel/composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist
              working-directory: backend_full_laravel

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate
              working-directory: backend_full_laravel

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=512M
              working-directory: backend_full_laravel

            - name: Run EasyCodingStandard (ECS)
              run: vendor/bin/ecs check
              working-directory: backend_full_laravel

            - name: Run Rector (dry-run)
              run: vendor/bin/rector process --dry-run
              working-directory: backend_full_laravel

            - name: Run Pest tests
              run: vendor/bin/pest
              working-directory: backend_full_laravel

    frontend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend_react

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: yarn
                  cache-dependency-path: frontend_react/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Typecheck
              run: yarn typecheck

            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Run tests
              run: yarn test

            # src/config/api.ts throws when VITE_API_BASE_URL is unset, on
            # purpose: a bundle that silently falls back to localhost is worse
            # than a build that refuses.
            - name: Build
              run: yarn build
              env:
                  VITE_API_BASE_URL: http://localhost:8081

    # The stack itself is CI-visible: a broken bind mount, a floating image tag
    # or a missing key in .env.docker.example used to survive indefinitely
    # because nothing in CI ever read docker-compose.yml.
    compose:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # Compose interpolates credentials and published ports from ./.env,
            # which is gitignored, and ${VAR:?} aborts when one is missing - so
            # this step also proves .env.docker.example still covers every key.
            - name: Create root .env from the committed example
              run: cp .env.docker.example .env

            - name: Validate docker-compose.yml
              run: docker compose config -q

            - name: Build images
              run: docker compose build

            # Compose only ever builds the `base` target, so the deployable
            # `prod` stage had no coverage at all - and it broke twice without CI
            # noticing: `config:cache` froze the build's empty env, and the image
            # spoke FastCGI when every host needs HTTP. Both are boot-time
            # failures, so booting it is the test.
            - name: Build the deployable image
              run: docker build -f php/Dockerfile --target prod -t sff-prod .

            - name: Refuse to start without APP_KEY
              run: |
                  if docker run --rm sff-prod true 2>/dev/null; then
                      echo "expected a missing APP_KEY to fail the boot" >&2
                      exit 1
                  fi

            # No databases here on purpose: /up does not touch them, so this
            # isolates "does the container serve HTTP on the injected port".
            - name: Serve HTTP on the injected port
              run: |
                  docker run -d --name sff-prod-smoke -p 8099:9187 \
                      -e PORT=9187 \
                      -e APP_KEY="base64:$(openssl rand -base64 32)" \
                      -e LOG_CHANNEL=stderr \
                      sff-prod
                  for i in $(seq 1 30); do
                      code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/up || true)
                      [ "$code" = "200" ] && echo "/up -> 200 after ${i}s" && exit 0
                      sleep 1
                  done
                  echo "/up never returned 200; last code=${code}" >&2
                  docker logs sff-prod-smoke
                  exit 1