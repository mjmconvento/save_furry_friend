name: main.yml
on: [push, pull_request]

jobs:
    code-quality:
        runs-on: ubuntu-latest

        # The suite runs against real Postgres and MongoDB rather than sqlite:
        # uuid primary keys, the user_followers composite cascade and ILIKE are
        # all things sqlite gets wrong or silently permits.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

            mongo:
                image: mongo:8.0
                env:
                    MONGO_INITDB_ROOT_USERNAME: admin
                    MONGO_INITDB_ROOT_PASSWORD: password
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        env:
            # PHPUnit does not overwrite variables that already exist in the
            # environment, so these override the Docker hostnames in phpunit.xml.
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            MONGODB_URI: mongodb://127.0.0.1:27017

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  # mongodb is required: the Post model and three migrations
                  # talk to MongoDB, so the suite cannot boot without it.
                  extensions: mbstring, pdo, pdo_pgsql, mongodb
                  coverage: none

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist
              working-directory: backend_full_laravel

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate
              working-directory: backend_full_laravel

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=512M
              working-directory: backend_full_laravel

            - name: Run EasyCodingStandard (ECS)
              run: vendor/bin/ecs check
              working-directory: backend_full_laravel

            - name: Run Rector (dry-run)
              run: vendor/bin/rector process --dry-run
              working-directory: backend_full_laravel

            - name: Run Pest tests
              run: vendor/bin/pest
              working-directory: backend_full_laravel

    frontend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend_react

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: yarn
                  cache-dependency-path: frontend_react/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Typecheck
              run: yarn typecheck

            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Run tests
              run: yarn test

            # src/config/api.ts throws when VITE_API_BASE_URL is unset, on
            # purpose: a bundle that silently falls back to localhost is worse
            # than a build that refuses.
            - name: Build
              run: yarn build
              env:
                  VITE_API_BASE_URL: http://localhost:8081
