# Dependabot version updates.
# Dependabot is built into GitHub — this file is all that is needed to get
# update pull requests. Security-only updates additionally require the
# "Dependabot security updates" toggle in the repository settings.
version: 2
updates:
  # Laravel API (composer.json / composer.lock).
  - package-ecosystem: composer
    directory: /backend_full_laravel
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-runtime:
        dependency-type: production
        update-types: [minor, patch]
      backend-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # React SPA. The npm ecosystem covers yarn.lock as well.
  - package-ecosystem: npm
    directory: /frontend_react
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        dependency-type: production
        update-types: [minor, patch]
      frontend-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # Base images in php/Dockerfile and frontend_react/Dockerfile.
  - package-ecosystem: docker
    directories:
      - /php
      - /frontend_react
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]
        update-types: [minor, patch]

  # Service images in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # postgres is pinned to 16 on purpose: 18 moved its data directory and
      # refuses to start against the existing pgdata volume.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # mongo is pinned to the 8.0 line (the tag still tracks 8.0.x patches).
      # Every 8.0 -> 8.x or 9.x jump refuses to start until
      # setFeatureCompatibilityVersion is raised first, so those bumps are a
      # manual, staged operation - not something to merge from a PR.
      - dependency-name: mongo
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      service-images:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used by .github/workflows/main.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
